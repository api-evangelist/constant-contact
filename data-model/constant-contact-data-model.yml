cross_reference:
  description: >-
    Three xref endpoints exist purely to translate legacy V2 identifiers into V3 UUIDs —
    getContactIdXrefs, getListIdXrefs and retrieveXrefMappingsUsingGET
    (v2_email_campaign_ids). They are the migration seam between the retired V2 API and V3.
notes:
- >-
  There is no generic search endpoint. Discovery is per-collection with resource-specific query
  parameters (contacts_filter, lists, segment_id, tags, status, email, updated_after/before,
  created_after/before, optout_after/before, sms_status).
- >-
  Deletion is soft on the core entities — ContactResource, ContactList and CustomField all carry
  a deleted_at field.
- >-
  The Billing surface added in build 3.0.178 (/billing/plan, /billing/transactions,
  /billing/next-payment, /billing/add-ons, /billing/branding/logo, and the statement and
  prepayment-invoice email endpoints) is not yet modelled here; it is undocumented in the
  release notes and unsplit in openapi/.
