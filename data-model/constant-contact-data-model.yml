provider: Constant Contact
providerId: constant-contact
description: >-
  The entity-relationship graph of the Constant Contact V3 API, derived from the $ref links and
  the *_id / *_ids reference fields in the published contract. Constant Contact is a
  contact-centric model: everything either describes a contact, groups contacts, or reports on
  what was sent to contacts.
id_style:
  format: UUID for most resources; opaque short strings for accounts
  prefixed: false
  note: >-
    Identifiers carry NO type prefix — a bare UUID gives an agent no clue whether it is a
    contact_id, a campaign_id or a campaign_activity_id, and the three are frequently adjacent
    in the same payload. The one exception is encoded_account_id (a short opaque token such as
    a07e1my9tbw0) used on partner endpoints.
  examples:
    contact_id: 4c1e2b60-3c1f-11ee-9a4e-fa163e6d5b3a
    campaign_activity_id: 8892baf9-970a-4de6-8400-fa4ec461987c
    activity_id: 04fe9a97-a579-43c5-bb1a-58ed29bf0a6a
    encoded_account_id: a07e1my9tbw0
entities:
