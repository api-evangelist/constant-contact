- from: EmailCampaignActivity
  to: ABTest
  type: has_one
  via: /emails/activities/{campaign_activity_id}/abtest
- from: EmailCampaignActivity
  to: EmailTrackingActivity
  type: has_many
  via: /reports/email_reports/{campaign_activity_id}/tracking/*
  note: sends, opens, unique_opens, didnotopens, clicks, forwards, optouts, bounces.
- from: Contact
  to: ContactTrackingActivity
  type: has_many
  via: /reports/contact_reports/{contact_id}/activity_details
- from: Event
  to: EventTrack
  type: has_many
  via: /events/{event_id}/tracks/{track_id}
- from: EventTrack
