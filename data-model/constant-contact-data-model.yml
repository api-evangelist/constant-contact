  schema: AccountInfoDto
  key: null
  description: The Constant Contact account itself — profile, organization address, plan, usage.
  operations: [getAccountById, putCustomerById, getPhysicalAddress, putPhysicalAddress,
    addPhysicalAddress, retrieveEmailAddresses, addAccountEmailAddress, getUserPrivileges]
- name: Contact
  schema: ContactResource
  key: contact_id
  description: The central entity. Carries email, name, company, dates and consent state.
  fields: [contact_id, email_address, first_name, last_name, job_title, company_name,
