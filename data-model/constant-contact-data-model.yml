relationships:
- from: Account
  to: Contact
  type: has_many
  via: implicit (account scope of the access token)
- from: Contact
  to: ContactList
  type: has_many
  via: list_memberships[] / list_ids[]
  note: Many-to-many. Written on the contact, and in bulk via postListAddContact.
- from: Contact
  to: Tag
  type: has_many
  via: taggings[] / tag_ids[]
  note: Many-to-many.
- from: Contact
  to: CustomField
  type: has_many
  via: custom_fields[].custom_field_id
  note: Value objects — the contact holds a value keyed by custom_field_id.
- from: Contact
  to: ContactPhoneNumber
  type: has_many
  via: phone_numbers[]
- from: Contact
  to: ContactStreetAddress
  type: has_many
  via: street_addresses[]
- from: Contact
  to: Note
  type: has_many
  via: notes[]
- from: Contact
  to: ContactSmsChannel
  type: has_one
  via: sms_channel
  note: Carries SMS consent state; a contact may now exist with sms_channel and no email_address.
- from: Segment
  to: Contact
  type: has_many
  via: criteria expression (dynamic; not a stored join)
- from: EmailCampaign
  to: EmailCampaignActivity
  type: has_many
  via: campaign_activities[].campaign_activity_id
  note: >-
    The most important relationship in the API. Content, audience and reporting all hang off the
    ACTIVITY; the campaign is a shell. Agents that key on campaign_id will not find stats.
- from: EmailCampaignActivity
  to: EmailCampaign
  type: belongs_to
  via: campaign_id
- from: EmailCampaignActivity
  to: ContactList
  type: has_many
  via: contact_list_ids[]
- from: EmailCampaignActivity
  to: Segment
  type: has_many
  via: segment_ids[]
- from: EmailCampaignActivity
  to: EmailSchedule
  type: has_many
