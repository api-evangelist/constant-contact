shared_rules:
- The campaign_activity_id, not the campaign_id, keys content, audience and every report.
- PUT is a full replace on contacts and campaign activities; read-merge-write or lose fields.
- No idempotency key exists on any of the 128 operations; retried POSTs duplicate or 409.
- 4 requests/second and 10,000/day per application, with no rate-limit headers and no Retry-After.
  Branch on error_key — throttled clears in a second, quota_exceeded not until 00:00 UTC.
- No contact or campaign event webhooks; only four partner billing topics. Everything else is polling.
- Errors come back in three different shapes — see errors/constant-contact-problem-types.yml.
- A 403 conflates missing scope, missing user privilege and a deactivated application.
