notes:
- >-
  Release notes are HTML prose on a static S3-hosted page with no RSS/Atom feed, no JSON, and
  no per-entry anchors — an agent cannot subscribe to API change, only re-scrape.
- >-
  The release notes UNDER-report what shipped. The 2026-08-13 re-harvest of
  https://api.cc.email/v3/swagger.yaml moved the contract from build 3.0.149 (86 paths, 120
  operations) to 3.0.178 (100 paths, 128 operations). Fourteen new paths appeared, none removed.
  The Social four are announced in the release notes; the Automations workflows surface
  (/automations/workflows, /automations/workflows/{automation_flow_id}, a new Automations tag)
  and the entire ten-path Billing surface (/billing/plan, /billing/transactions,
  /billing/next-payment, /billing/add-ons, /billing/branding/logo, /billing/statement/email,
  /billing/prepayment-invoice/email and friends) are NOT mentioned in any release note. The spec
  is the more truthful changelog here.
- >-
  See openapi/_original/HARVEST.yml for the full path-level diff.
