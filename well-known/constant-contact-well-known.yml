description: >-
  Constant Contact serves NO /.well-known/ document on any of its hosts. Every path below was
  probed anonymously and every one missed. api.cc.email is an API gateway that answers a flat
  403 {"message":"Forbidden"} for any path outside /v3; developer.constantcontact.com is an S3
  static site that answers 403 AccessDenied for any missing key (its 403 is a 404 in disguise);
  www.constantcontact.com answers a Next.js 404 shell; authz.constantcontact.com — the OAuth2
  authorization server named in every securityScheme — returns an empty 404 for both
  /.well-known/openid-configuration and /.well-known/oauth-authorization-server, and also for
  the /oauth2/default/ prefixed variants an Okta-shaped issuer would normally serve.
  Because nothing returned a real document, this repo emits NO WellKnown and NO SecurityTxt
  pointer in apis.yml. That absence is the finding.
